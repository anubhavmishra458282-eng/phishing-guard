<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      color: #1e293b;
      background: #ffffff;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #0f172a;
    }
    .url-box {
      font-size: 0.8rem;
      word-break: break-all;
      background: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      color: #475569;
      max-height: 50px;
      overflow-y: auto;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .result-box {
      margin-top: 12px;
      padding: 12px;
      border-radius: 6px;
      display: none;
    }
    .badge {
      display: inline-block;
      font-weight: bold;
      font-size: 0.85rem;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .signals-list {
      margin: 8px 0 0 0;
      padding-left: 16px;
      font-size: 0.78rem;
      color: #b91c1c;
    }
  </style>
</head>
<body>
  <h3>🛡️ PhishGuard Quick Scan</h3>
  <div id="urlDisplay" class="url-box">Detecting active tab...</div>
  <button id="scanBtn">Scan Current Page</button>

  <div id="resultBox" class="result-box">
    <div id="badge" class="badge"></div>
    <div id="score" style="font-weight: bold; font-size: 0.85rem;"></div>
    <ul id="signals" class="signals-list"></ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
